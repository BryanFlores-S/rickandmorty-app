version: '3.8'

services:
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - rickandmorty-app
      - minimarket-app

  rickandmorty-app:
    image: bryanflores001/rickandmorty-app:latest
    container_name: rickandmorty-app-container
    restart: always
    expose:
      - "8081"
    networks:
      - app-network

  minimarket-app:
    image: bryanflores001/minimarket:latest
    container_name: minimarket-app-container
    restart: always
    expose:
      - "8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge