<!DOCTYPE html><html lang="es-419"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty - Catálogo de Personajes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/styles.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Section (Pinterest Style Search Bar) -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <!-- App Logo -->
            <div class="flex items-center gap-2 cursor-pointer" id="logo-button">
                <div class="bg-emerald-500 text-white font-bold text-xl px-3 py-1 rounded-full shadow">R&M</div>
                <span class="hidden sm:inline font-bold text-gray-700 text-lg">Rick & Morty</span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl relative">
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Buscar personaje (ej. Rick, Morty)..." 
                        class="w-full bg-gray-100 focus:bg-white text-gray-800 text-sm sm:text-base rounded-full py-2.5 pl-11 pr-10 border border-transparent focus:border-emerald-500 outline-none transition-all shadow-inner"
                    >
                    <button id="clear-search-btn" class="hidden absolute right-3 text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Intentional Delay Counter Banner (Subtle Overlay) -->
    <div id="countdown-banner" class="hidden bg-emerald-600 text-white text-xs sm:text-sm py-1.5 px-4 text-center font-medium shadow-md transition-all">
        <span>Buscando datos con simulación de red... Tiempo restante: </span>
        <span id="countdown-timer" class="font-bold underline text-yellow-300">4</span>s
    </div>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- Section Header -->
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h1 id="section-title" class="text-xl sm:text-2xl font-bold text-gray-800">Personajes Populares</h1>
            <span id="results-count" class="text-xs sm:text-sm text-gray-500 font-medium"></span>
        </div>

        <!-- Characters Grid Layout (Horizontal Cards like Image #2) -->
        <div id="characters-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
            <!-- JS dynamically injects cards here -->
        </div>

        <!-- Loading GIF State (Centred with image) -->
        <div id="loading-state" class="hidden my-12 flex flex-col items-center justify-center gap-3">
            <img src="./img/loading.gif" alt="Cargando..." class="w-16 h-16 object-contain">
            <p class="text-sm font-semibold text-emerald-600 animate-pulse">Obteniendo datos de la API...</p>
        </div>

        <!-- Infinite Scroll Sentinel Anchor -->
        <div id="scroll-sentinel" class="h-10 w-full"></div>
    </main>

    <!-- Detail Modal / Window (Partial on Large Screens, Fullscreen on Mobile) -->
    <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full h-full sm:h-auto sm:max-h-[90vh] sm:max-w-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden transform transition-all">
            
            <!-- Modal Header / Back Button -->
            <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                <button id="modal-back-btn" class="flex items-center gap-2 text-emerald-600 hover:text-emerald-700 font-semibold text-sm py-1 px-3 rounded-lg hover:bg-emerald-50 transition-all">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Volver a la lista</span>
                </button>
                <span class="text-xs uppercase tracking-wider font-bold text-gray-400">Detalle del Personaje</span>
            </div>

            <!-- Modal Content (Scrollable) -->
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 space-y-6">
                <!-- JS Populates dynamic detail view here -->
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="./js/app.js"></script></body></html>
