events {
    worker_connections 1024;
}

http {
    upstream rickandmorty_service {
        server rickandmorty-app-container:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Route requests to Rick and Morty application
        location /rickandmorty/ {
            proxy_pass http://rickandmorty_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default fallback route
        location / {
            return 404 '{"error": "Resource not found on API Gateway"}';
            default_type application/json;
        }
    }
}