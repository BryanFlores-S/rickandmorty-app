events {
    worker_connections 1024;
}

http {
    upstream minimarket_service {
        server minimarket-app-container:8080;
    }

    upstream rickandmorty_service {
        server rickandmorty-app-container:8081;
    }

    server {
        listen 80;
        server_name localhost;

        # Route requests for Rick and Morty App
        location /rickandmorty/ {
            proxy_pass http://rickandmorty_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route requests for Minimarket App
        location /minimarket/ {
            proxy_pass http://minimarket_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default fallback route
        location / {
            return 404 '{"error": "Resource not found on API Gateway"}';
            default_type application/json;
        }
    }
}